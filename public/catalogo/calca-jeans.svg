<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="denim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f73a8"/>
      <stop offset="1" stop-color="#2c4a78"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="300" cy="560" rx="170" ry="16" fill="url(#floor)"/>
  <!-- pernas -->
  <path d="M190 95 L410 95 L432 548 L328 552 L302 230 L298 230 L272 552 L168 548 Z" fill="url(#denim)"/>
  <path d="M190 95 L410 95 L432 548 L328 552 L302 230 L298 230 L272 552 L168 548 Z" fill="url(#shade)"/>
  <!-- cós -->
  <path d="M188 70 L412 70 L412 104 L188 104 Z" fill="#3a5d92"/>
  <path d="M188 70 L412 70 L412 104 L188 104 Z" fill="none" stroke="#e8a13a" stroke-width="2" stroke-dasharray="6 5" transform="translate(0 0)"/>
  <!-- passantes -->
  <g fill="#3a5d92" stroke="#e8a13a" stroke-width="1.5" stroke-dasharray="4 4">
    <rect x="210" y="64" width="14" height="48" rx="3"/>
    <rect x="292" y="64" width="14" height="48" rx="3"/>
    <rect x="376" y="64" width="14" height="48" rx="3"/>
  </g>
  <!-- botão e rebite -->
  <circle cx="318" cy="87" r="9" fill="#c9a24a" stroke="#8a6a24" stroke-width="2"/>
  <!-- braguilha -->
  <path d="M300 104 L300 200 Q300 222 322 222" fill="none" stroke="#e8a13a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- bolsos frontais -->
  <path d="M196 112 Q232 112 248 160" fill="none" stroke="#e8a13a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M404 112 Q368 112 352 160" fill="none" stroke="#e8a13a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- costuras laterais -->
  <path d="M192 120 L172 540" fill="none" stroke="#e8a13a" stroke-width="2" stroke-dasharray="7 6" opacity="0.8"/>
  <path d="M408 120 L428 540" fill="none" stroke="#e8a13a" stroke-width="2" stroke-dasharray="7 6" opacity="0.8"/>
  <!-- desgaste nos joelhos -->
  <ellipse cx="232" cy="360" rx="26" ry="40" fill="#fff" opacity="0.10"/>
  <ellipse cx="368" cy="360" rx="26" ry="40" fill="#fff" opacity="0.10"/>
